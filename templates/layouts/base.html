{{define "layouts/base.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Ax Experiments</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@imacrayon/alpine-ajax@0.7.0/dist/cdn.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <h1><a href="/">Ax Experiments</a></h1>
            <ul>
                <li><a href="/experiments">Experiments</a></li>
                <li><a href="/experiments/new">New Experiment</a></li>
            </ul>
        </nav>
    </header>

    <div id="messages" x-sync x-merge="append"></div>

    <main>
        {{template "content" .}}
    </main>

    <footer>
        <p>Built with <a href="https://github.com/ax-llm/ax">Ax Framework</a>, Alpine AJAX, and Go</p>
    </footer>
</body>
</html>
{{end}}
